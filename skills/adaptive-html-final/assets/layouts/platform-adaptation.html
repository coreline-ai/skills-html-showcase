<!-- Layout: platform-adaptation-layout / editorial platform theme -->
<main id="main" class="page-wide layout-platform">
  <header class="header platform-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="original-summary">{{ORIGINAL_SUMMARY}}</section>
  <section class="platform-strategy">{{PLATFORM_STRATEGY}}</section>
  <div class="platform-grid">{{PLATFORM_CARDS}}</div>
  <section class="platform-comparison-table">{{COMPARISON_TABLE}}</section>
  <section class="try publish-checklist">{{PUBLISH_CHECKLIST}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
