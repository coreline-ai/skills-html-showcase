<!-- Layout: skill-audit-report / editorial audit theme -->
<main id="main" class="page-wide layout-audit">
  <header class="header audit-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="executive-summary">{{PURPOSE}}</section>
  <section class="summary-grid">{{STRUCTURE_SCORE}}</section>
  <section class="line-audit">{{LINE_AUDIT}}</section>
  <section class="priority-roadmap">{{IMPROVEMENTS}}</section>
  <section class="try">{{FINAL_SKILL}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
