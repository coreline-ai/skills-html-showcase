<!-- Layout: seo-optimizer-dashboard-layout / editorial dashboard theme -->
<main id="main" class="page-wide layout-seo">
  <header class="header seo-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="seo-overview">{{PRIMARY_KEYWORD}}</section>
  <section class="serp-preview">{{SERP_PREVIEW}}</section>
  <section class="title-candidates">{{TITLE_CANDIDATES}}</section>
  <section class="meta-candidates">{{META_CANDIDATES}}</section>
  <section class="keyword-cluster">{{TAG_CLUSTER}}</section>
  <section class="content-outline">{{CONTENT_OUTLINE}}</section>
  <section class="try final-seo-set">{{FINAL_SEO_SET}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
