<!-- Layout: expert-briefing-report-layout / editorial report theme -->
<main id="main" class="page-wide layout-expert">
  <header class="header report-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="executive-summary">{{EXECUTIVE_SUMMARY}}</section>
  <section class="decision-grid">{{DECISION_CARDS}}</section>
  <section class="architecture-map">{{ARCHITECTURE}}</section>
  <section class="risk-matrix">{{RISK_MATRIX}}</section>
  <section class="priority-roadmap">{{PRIORITY_ROADMAP}}</section>
  <section class="validation-checklist">{{VALIDATION_CHECKLIST}}</section>
  <section class="try">{{FINAL_RECOMMENDATION}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
