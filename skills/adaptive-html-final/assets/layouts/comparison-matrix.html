<!-- Layout: comparison-matrix / editorial decision matrix theme -->
<main id="main" class="page-wide layout-compare">
  <header class="header compare-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="decision-context">{{DECISION_CONTEXT}}</section>
  <section class="matrix">{{MATRIX}}</section>
  <section class="winners">{{WINNERS}}</section>
  <section class="tradeoffs">{{TRADEOFFS}}</section>
  <section class="try">{{RECOMMENDATION}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
