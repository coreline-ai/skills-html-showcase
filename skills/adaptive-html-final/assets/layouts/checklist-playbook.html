<!-- Layout: checklist-playbook / editorial operations theme -->
<main id="main" class="page-wide layout-checklist">
  <header class="header checklist-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="summary-card">{{USE_CASE}}</section>
  <section class="check-grid">{{CHECK_GRID}}</section>
  <section class="failure-modes">{{FAILURE_MODES}}</section>
  <section class="try">{{DONE_CRITERIA}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
