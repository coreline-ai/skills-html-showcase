<!-- Layout: case-study / editorial case theme -->
<main id="main" class="page-wide layout-case">
  <header class="header case-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="summary-card">{{SITUATION}}</section>
  <section class="timeline">{{TIMELINE}}</section>
  <section class="decisions">{{DECISIONS}}</section>
  <section class="results">{{RESULTS}}</section>
  <section class="try">{{LESSONS}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
