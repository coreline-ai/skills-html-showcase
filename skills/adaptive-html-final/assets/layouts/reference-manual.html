<!-- Layout: reference-manual / editorial reference theme -->
<main id="main" class="page-wide layout-reference">
  <header class="header reference-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="quick-reference">{{QUICK_REFERENCE}}</section>
  <section class="ref-grid">{{API_OR_CONCEPTS}}</section>
  <section class="patterns">{{PATTERNS}}</section>
  <section class="examples">{{EXAMPLES}}</section>
  <section class="try">{{CHECKLIST}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
