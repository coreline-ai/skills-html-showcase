<!-- Layout: youtube-analysis / evidence-first video analysis report theme -->
<main id="main" class="page-wide layout-youtube">
  <header class="header youtube-header"><div class="kicker"><span class="kicker-text">{{KICKER}}</span></div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="youtube-verdict">{{VERDICT}}</section>
  <nav class="toc youtube-question-toc" aria-label="YouTube 분석 목차">{{QUESTION_TOC}}</nav>
  <section class="source-trust">{{SOURCE_TRUST}}</section>
  <section class="watching-decision">{{WATCHING_DECISION}}</section>
  <section class="video-evidence-map">{{VIDEO_EVIDENCE_MAP}}</section>
  <section class="chapter-retention">{{CHAPTER_RETENTION}}</section>
  <section class="comment-signals">{{COMMENT_SIGNALS}}</section>
  <section class="opportunity-matrix">{{OPPORTUNITY_MATRIX}}</section>
  <section class="claim-risk">{{CLAIM_RISK}}</section>
  <section class="video-blueprint">{{VIDEO_BLUEPRINT}}</section>
  <section class="reuse-pack">{{REUSE_PACK}}</section>
  <section class="try">{{NEXT_ACTIONS}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
