<!-- Layout: magazine-article-layout / editorial article theme -->
<main id="main" class="page-wide layout-article">
  <header class="header article-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub lead">{{LEAD}}</p><div class="meta">{{META}}</div></header>
  <aside class="pull-quote">{{PULL_QUOTE}}</aside>
  <article><section>{{PROBLEM}}</section><section>{{CONTEXT}}</section><section>{{CORE_ARGUMENT}}</section><section>{{CASE_STUDY}}</section><section>{{CONCLUSION}}</section></article>
  <section class="box article-takeaway">{{TAKEAWAY}}</section>
  <section class="related-list">{{RELATED_TOPICS}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
