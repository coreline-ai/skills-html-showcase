<!-- Layout: landing-brief / restrained editorial landing theme -->
<main id="main" class="page-wide layout-landing">
  <header class="header landing-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="hero-analogy">{{HERO}}</section>
  <section class="value-grid">{{VALUE_PROPS}}</section>
  <section class="how-it-works">{{HOW_IT_WORKS}}</section>
  <section class="faq">{{FAQ}}</section>
  <section class="try">{{CTA}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
