<!-- Layout: course-module-layout / editorial course theme -->
<main id="main" class="page-wide layout-education">
  <header class="header course-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div></header>
  <section class="learning-goals">{{LEARNING_GOALS}}</section>
  <section class="before-start">{{BEFORE_START}}</section>
  <section class="lesson-step">{{CONCEPT_LESSON}}</section>
  <section class="example-block">{{EXAMPLE}}</section>
  <section class="practice-card">{{PRACTICE}}</section>
  <section class="quiz-box">{{QUIZ}}</section>
  <section class="answer-box">{{ANSWER_KEY}}</section>
  <section class="try">{{REVIEW_CHECKLIST}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
