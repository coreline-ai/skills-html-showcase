<!-- Layout: github-analysis / repository due-diligence report theme -->
<main id="main" class="page-wide layout-github">
  <header class="header github-header"><div class="kicker"><span class="kicker-text">{{KICKER}}</span></div><h1>{{TITLE}}</h1><p class="sub">{{SUBTITLE}}</p><div class="meta">{{META}}</div>{{GENERATED_ROW}}</header>
  <section class="github-verdict">{{VERDICT}}</section>
  <nav class="toc github-question-toc" aria-label="GitHub 분석 목차">{{QUESTION_TOC}}</nav>
  <section class="repo-identity">{{REPO_IDENTITY}}</section>
  <section class="quickstart-readiness">{{QUICKSTART_READINESS}}</section>
  <section class="repo-health">{{REPO_HEALTH}}</section>
  <section class="code-tour">{{CODE_TOUR}}</section>
  <section class="release-roadmap">{{RELEASES_AND_ROADMAP}}</section>
  <section class="security-license">{{SECURITY_AND_LICENSE}}</section>
  <section class="risk-matrix">{{RISK_MATRIX}}</section>
  <section class="decision-tree">{{FINAL_DECISION}}</section>
  <section class="try">{{NEXT_ACTIONS}}</section>
  <aside class="source-note">{{SOURCE_NOTE}}</aside>
</main>
