<svg xmlns="http://www.w3.org/2000/svg" width="8000" height="6000" viewBox="0 0 8000 6000" role="img" aria-labelledby="title desc">
<title id="title">스윔레인</title><desc id="desc">역할별 병렬 진행을 보여줄 때. Warm cream soft card visual in adaptive-html-final style.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4e8"/><stop offset=".55" stop-color="#fffaf4"/><stop offset="1" stop-color="#f8e1cf"/></linearGradient>
  <linearGradient id="orangeSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbd72"/><stop offset="1" stop-color="#ff8a2f"/></linearGradient>
  <linearGradient id="purpleSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5d9ff"/><stop offset="1" stop-color="#9a75ff"/></linearGradient>
  <linearGradient id="mintSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff8ec"/><stop offset="1" stop-color="#61d1a0"/></linearGradient>
