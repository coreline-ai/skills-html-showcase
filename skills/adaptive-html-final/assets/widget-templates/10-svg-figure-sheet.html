<!-- Widget 10: SVG Figure Sheet | 프로토·다이어그램 | css-only -->
<!-- 순수 인라인 SVG 4종(figure+figcaption). 모든 fill/stroke는 theme 토큰 var()로 채색(하드코딩 흰색은 대비용 최소 사용). 각 SVG에 role=img+<title>로 접근성 라벨 제공. 인터랙션 없는 정적 시트라 CSS-only. -->
<style>
.wg-10-sheet{font-family:var(--sans);color:var(--ink);max-width:620px;margin:0 auto}
.wg-10-h{font-family:var(--sans);font-size:var(--fs-lg);font-weight:800;margin:0 0 var(--space-5)}
.wg-10-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--space-4)}
.wg-10-fig{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;transition:box-shadow .18s,transform .18s}
.wg-10-fig:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.wg-10-fig{transition:none}.wg-10-fig:hover{transform:none}}
.wg-10-stage{background:var(--bg);display:grid;place-items:center;padding:var(--space-4);border-bottom:1px solid var(--line)}
.wg-10-svg{width:100%;max-width:96px;height:auto;display:block}
.wg-10-cap{display:flex;flex-direction:column;gap:2px;padding:var(--space-3) var(--space-4)}
.wg-10-cap strong{font-size:var(--fs-sm);color:var(--ink);font-weight:700}
.wg-10-cap span{font-size:var(--fs-xs);color:var(--ink-mute)}
.mode-template-contract .wg-10-sheet{margin:var(--space-5) auto 0}
</style>
<section class="wg-10-sheet" aria-label="재사용 SVG 일러스트 시트">
  <h3 class="wg-10-h">시스템 아이콘 &amp; 일러스트 시트</h3>
  <div class="wg-10-grid">

    <figure class="wg-10-fig">
      <div class="wg-10-stage">
        <svg viewBox="0 0 120 120" role="img" aria-labelledby="wg-10-t1" class="wg-10-svg">
          <title id="wg-10-t1">계층형 서버 스택</title>
          <rect x="24" y="22" width="72" height="20" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
          <rect x="24" y="50" width="72" height="20" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
          <rect x="24" y="78" width="72" height="20" rx="4" fill="var(--accent)" stroke="var(--accent-2)" stroke-width="2"/>
          <circle cx="34" cy="32" r="3" fill="var(--good-label-ink)"/>
          <circle cx="34" cy="60" r="3" fill="var(--good-label-ink)"/>
          <circle cx="34" cy="88" r="3" fill="#fff"/>
        </svg>
      </div>
      <figcaption class="wg-10-cap"><strong>서버 스택</strong><span>다층 인프라 구성도</span></figcaption>
    </figure>

    <figure class="wg-10-fig">
      <div class="wg-10-stage">
        <svg viewBox="0 0 120 120" role="img" aria-labelledby="wg-10-t2" class="wg-10-svg">
          <title id="wg-10-t2">데이터 흐름 노드</title>
          <line x1="30" y1="60" x2="60" y2="34" stroke="var(--line)" stroke-width="3"/>
          <line x1="30" y1="60" x2="60" y2="86" stroke="var(--line)" stroke-width="3"/>
          <line x1="60" y1="34" x2="90" y2="60" stroke="var(--line)" stroke-width="3"/>
          <line x1="60" y1="86" x2="90" y2="60" stroke="var(--line)" stroke-width="3"/>
          <circle cx="30" cy="60" r="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
          <circle cx="60" cy="34" r="9" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
          <circle cx="60" cy="86" r="9" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
          <circle cx="90" cy="60" r="10" fill="var(--accent)" stroke="var(--accent-2)" stroke-width="2"/>
        </svg>
      </div>
      <figcaption class="wg-10-cap"><strong>데이터 흐름</strong><span>입력&rarr;처리&rarr;출력 노드</span></figcaption>
    </figure>

    <figure class="wg-10-fig">
      <div class="wg-10-stage">
        <svg viewBox="0 0 120 120" role="img" aria-labelledby="wg-10-t3" class="wg-10-svg">
          <title id="wg-10-t3">보안 방패 체크</title>
          <path d="M60 18 L94 30 V60 C94 82 78 96 60 102 C42 96 26 82 26 60 V30 Z" fill="var(--good-bg)" stroke="var(--good-label-ink)" stroke-width="2.5"/>
          <path d="M46 60 L56 70 L76 48" fill="none" stroke="var(--good-label-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <figcaption class="wg-10-cap"><strong>보안 통과</strong><span>검증 완료 상태 표시</span></figcaption>
    </figure>

    <figure class="wg-10-fig">
      <div class="wg-10-stage">
        <svg viewBox="0 0 120 120" role="img" aria-labelledby="wg-10-t4" class="wg-10-svg">
          <title id="wg-10-t4">상승 추세 막대 차트</title>
          <line x1="24" y1="96" x2="100" y2="96" stroke="var(--ink)" stroke-width="2"/>
          <rect x="32" y="72" width="14" height="24" rx="2" fill="var(--line)"/>
          <rect x="53" y="56" width="14" height="40" rx="2" fill="var(--ink-soft)"/>
          <rect x="74" y="34" width="14" height="62" rx="2" fill="var(--accent)"/>
          <path d="M32 70 L60 52 L88 30" fill="none" stroke="var(--accent-2)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="88" cy="30" r="4" fill="var(--accent-2)"/>
        </svg>
      </div>
      <figcaption class="wg-10-cap"><strong>성장 지표</strong><span>분기별 상승 추세</span></figcaption>
    </figure>

  </div>
</section>
