body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  line-height:1.8;
  letter-spacing:-.012em;
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-underline-offset:3px}
a:hover{color:var(--accent)}
.skip{position:absolute;left:-999px;top:8px;background:var(--dark);color:#fff;padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.page,.wrap{width:min(var(--max-reading),calc(100% - 44px));margin:0 auto;padding:60px 0 100px}
.page-wide{width:min(var(--max-wide),calc(100% - 44px));margin:0 auto;padding:60px 0 100px}
/* wide layout / narrow prose: constrain section-level running text to a readable measure; tables·grids·cards keep full width */
.page-wide>section>p,.page-wide>section>ul,.page-wide>section>ol,.page-wide>article>p,.page-wide>article>ul,.page-wide>article>ol,.page-wide>p{max-width:46rem}
.page-wide.layout-expert>section>p,.page-wide.layout-expert>section>ul,.page-wide.layout-expert>section>ol,.page-wide.layout-compare>section>p,.page-wide.layout-compare>section>ul,.page-wide.layout-compare>section>ol,.page-wide.layout-seo>section>p,.page-wide.layout-seo>section>ul,.page-wide.layout-seo>section>ol,.page-wide.layout-platform>section>p,.page-wide.layout-platform>section>ul,.page-wide.layout-platform>section>ol,.page-wide.layout-landing>section>p,.page-wide.layout-landing>section>ul,.page-wide.layout-landing>section>ol,.page-wide.layout-case>section>p,.page-wide.layout-case>section>ul,.page-wide.layout-case>section>ol,.page-wide.layout-checklist>section>p,.page-wide.layout-checklist>section>ul,.page-wide.layout-checklist>section>ol,.page-wide.layout-reference>section>p,.page-wide.layout-reference>section>ul,.page-wide.layout-reference>section>ol,.page-wide.layout-audit>section>p,.page-wide.layout-audit>section>ul,.page-wide.layout-audit>section>ol,.page-wide.layout-skill-audit>section>p,.page-wide.layout-skill-audit>section>ul,.page-wide.layout-skill-audit>section>ol{max-width:60rem}
.header{padding:0 0 32px;border-bottom:1px solid var(--line);margin-bottom:42px}
.kicker{font-size:13px;letter-spacing:.18em;color:var(--accent-2);font-weight:800;text-transform:uppercase;margin-bottom:16px}
h1{font-family:var(--serif);font-size:clamp(31px,4vw,42px);line-height:1.34;font-weight:700;letter-spacing:-.02em;margin:0 0 16px}
.sub,.lead{font-size:16px;color:var(--ink-soft);margin:0 0 24px;max-width:820px}
.lead{font-size:18px;line-height:1.75;color:var(--ink-soft)}
.byline{font-size:13px;color:var(--ink-mute);padding-bottom:30px;border-bottom:1px solid var(--line);margin-bottom:8px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.meta span,.tag{display:inline-flex;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.52);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--chip-ink)}
section{margin:46px 0}
h2{font-family:var(--serif);font-size:clamp(24px,3vw,29px);line-height:1.42;font-weight:700;letter-spacing:-.01em;margin:64px 0 8px;scroll-margin-top:24px;color:var(--ink)}
section>h2:first-child,
article>h2:first-child,
.box>h2:first-child,
.summary-card>h2:first-child,
.toc>h2:first-child,
.faq>h2:first-child,
.cta-box>h2:first-child,
.source-note>h2:first-child,
.card-block>h2:first-child,
.mini-card>h2:first-child{margin-top:0}
h2 .no,h2 .num{display:inline-grid;place-items:center;min-width:34px;width:auto;height:34px;padding:0 9px;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:999px;font-family:var(--sans);font-size:15px;font-weight:800;margin-right:12px;vertical-align:3px;line-height:1}
/* opt-in: only the 1-2 most important section numbers use solid brand red */
h2 .no.is-key,h2 .num.is-key{background:var(--accent);color:#fff;border-color:var(--accent)}
.h2-sub{font-size:14px;color:var(--ink-mute);margin:0 0 22px 46px;line-height:1.7}
h3{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.45;margin:28px 0 10px;color:var(--ink)}

article>h3:first-child,
.box>h3:first-child,
.summary-card>h3:first-child,
.toc>h3:first-child,
.faq>h3:first-child,
.cta-box>h3:first-child,
.source-note>h3:first-child,
.card-block>h3:first-child,
.mini-card>h3:first-child{margin-top:0}
h4{font-size:15px;font-weight:700;margin:18px 0 8px;color:var(--ink)}
p{margin:0 0 16px;color:var(--ink-soft);font-size:15.5px}
strong{color:var(--ink);font-weight:700}
ul,ol{margin:12px 0 18px 22px;color:var(--ink-soft)}
li{margin:6px 0}
footer{border-top:1px solid var(--line);margin-top:56px;padding-top:20px;color:var(--ink-mute);font-size:13px}
footer p{font-size:13px;color:var(--ink-mute)}
@media(max-width:760px){
  body{line-height:1.74}

/* adaptive-html-final shape-visuals — 본문 설명 시작부 보조 SVG 도형(8000x6000, warm soft).
   무 JS · 프로파일 무관 조건부 인라인. 도형은 시각 앵커이고 핵심 정보는 항상 HTML 텍스트로 둔다.
   삽입 표준: figure.shape-figure 안에 img.shape-img(8000x6000 svg, 비어있지 않은 alt 필수). figcaption은 선택(앵커라서).
   alt는 shape_visual_gate가, svg 파일 존재는 broken_local_ref가 검사한다. 삽입 예시는 references/visual-template-system.md 참조. */
.shape-figure{max-width:420px;margin:6px 0 18px}
.shape-figure img,.shape-img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;background:#fff4e8;border:1px solid var(--line);border-radius:16px}
.shape-figure figcaption{margin-top:8px;font-size:13px;color:var(--ink-mute);line-height:1.5}
/* 제목 아래 대표 도형 + 옆 설명(읽기 전 구조 프리뷰) */
.shape-lead{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:center;margin:18px 0}
.shape-lead .shape-figure{max-width:210px;margin:0}
.shape-lead-body>:first-child{margin-top:0}
.shape-lead-body>:last-child{margin-bottom:0}
/* 도형 갤러리(여러 개념을 균등 나열할 때만) */
.shape-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:18px 0}
.shape-grid .shape-figure{max-width:none;margin:0}
@media(max-width:760px){.shape-lead{grid-template-columns:1fr}.shape-lead .shape-figure{max-width:300px}.shape-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.shape-grid{grid-template-columns:1fr}}
