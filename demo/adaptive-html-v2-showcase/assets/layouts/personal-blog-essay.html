<!-- Layout: personal-blog-essay-layout -->
<main class="page layout-blog">
  <header class="header blog-header"><div class="kicker">{{KICKER}}</div><h1>{{TITLE}}</h1><p class="sub hook">{{HOOK}}</p><div class="meta">{{META}}</div></header>
  <aside class="box personal-note">{{PERSONAL_NOTE}}</aside>
  <article><section>{{WHY_NOW}}</section><section>{{MY_VIEW}}</section><section>{{EXAMPLE}}</section><section>{{HOW_TO_START}}</section><section>{{CLOSING_THOUGHT}}</section></article>
  <section class="try soft-cta">{{SOFT_CTA}}</section>
</main>
