<svg xmlns="http://www.w3.org/2000/svg" width="8000" height="6000" viewBox="0 0 8000 6000" role="img" aria-labelledby="title desc">
<title id="title">원문 인용</title><desc id="desc">원문 보존 또는 출처를 보여줄 때. Warm cream soft card visual in adaptive-html-final style.</desc>
<defs>
