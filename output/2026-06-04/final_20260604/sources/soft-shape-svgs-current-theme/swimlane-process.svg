<rect x="-1060" y="-850" width="720" height="170" rx="80" fill="#f1ccd0"/>
<rect x="-240" y="-120" width="840" height="170" rx="80" fill="#d77a82" opacity=".75"/>
<rect x="520" y="620" width="760" height="170" rx="80" fill="#dce9df"/>

</g>
