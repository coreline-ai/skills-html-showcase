<g><rect x="2100" y="1800" width="3800" height="2500" rx="260" fill="#fffaf5" stroke="#ead8c7" stroke-width="30" filter="url(#soft)"/><circle cx="2700" cy="2400" r="250" fill="#ff8a2f"/><rect x="3180" y="2180" width="1500" height="120" rx="60" fill="#eadbd0"/><rect x="3180" y="2500" width="2100" height="120" rx="60" fill="#eadbd0"/><path d="M2550 3650l620-470 530 260 670-760 900 580" fill="none" stroke="#9a75ff" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/></g>
