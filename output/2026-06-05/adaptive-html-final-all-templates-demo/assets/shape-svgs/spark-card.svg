  <style>.k{font:900 150px -apple-system,BlinkMacSystemFont,'Pretendard','Segoe UI',sans-serif;fill:#d54855;letter-spacing:11px}.t{font:900 310px Georgia,'Noto Serif KR',serif;fill:#1a1a1a;letter-spacing:-8px}.s{font:600 120px -apple-system,BlinkMacSystemFont,'Pretendard','Segoe UI',sans-serif;fill:#6e6258}</style>
</defs>
<rect width="8000" height="6000" fill="#f2e9df"/><rect x="470" y="430" width="7060" height="5140" rx="330" fill="url(#bg)" stroke="#ead8c7" stroke-width="16" filter="url(#shadow)"/>
<rect x="470" y="980" width="7060" height="10" fill="#fff" opacity=".72"/>
