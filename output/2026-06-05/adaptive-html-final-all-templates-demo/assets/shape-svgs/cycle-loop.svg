<svg xmlns="http://www.w3.org/2000/svg" width="8000" height="6000" viewBox="0 0 8000 6000" role="img" aria-labelledby="title desc">
<title id="title">순환 루프</title><desc id="desc">반복 개선 사이클을 설명할 때. Warm cream soft card visual in adaptive-html-final style.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4e8"/><stop offset=".55" stop-color="#fffaf4"/><stop offset="1" stop-color="#f8e1cf"/></linearGradient>
  <linearGradient id="orangeSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbd72"/><stop offset="1" stop-color="#ff8a2f"/></linearGradient>
  <linearGradient id="purpleSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5d9ff"/><stop offset="1" stop-color="#9a75ff"/></linearGradient>
  <linearGradient id="mintSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff8ec"/><stop offset="1" stop-color="#61d1a0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="32" stdDeviation="54" flood-color="#c79565" flood-opacity=".22"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#ac7c53" flood-opacity=".16"/></filter>
  <style>.k{font:900 150px -apple-system,BlinkMacSystemFont,'Pretendard','Segoe UI',sans-serif;fill:#d54855;letter-spacing:11px}.t{font:900 310px Georgia,'Noto Serif KR',serif;fill:#1a1a1a;letter-spacing:-8px}.s{font:600 120px -apple-system,BlinkMacSystemFont,'Pretendard','Segoe UI',sans-serif;fill:#6e6258}</style>
</defs>
<rect width="8000" height="6000" fill="#f2e9df"/><rect x="470" y="430" width="7060" height="5140" rx="330" fill="url(#bg)" stroke="#ead8c7" stroke-width="16" filter="url(#shadow)"/>
<rect x="470" y="980" width="7060" height="10" fill="#fff" opacity=".72"/>
<text x="880" y="840" class="k">SOFT SHAPE</text><rect x="6460" y="620" width="560" height="560" rx="155" fill="#242421" filter="url(#soft)"/><text x="6740" y="980" text-anchor="middle" font-family="Georgia,serif" font-size="260" font-weight="900" fill="#ff9b46">AI</text>
