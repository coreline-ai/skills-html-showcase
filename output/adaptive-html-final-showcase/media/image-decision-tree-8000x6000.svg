<svg xmlns="http://www.w3.org/2000/svg" width="8000" height="6000" viewBox="0 0 8000 6000" role="img" aria-labelledby="title desc">
<title id="title">섹션 이미지 선택 의사결정 트리</title>
<desc id="desc">이미지를 찾을지 만들지 판단하는 운영 규칙</desc>
<style>
  text { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", Arial, sans-serif; }
  .small { font-size: 92px; fill: #7a7a7a; font-weight: 650; }
  .hair { stroke:#d8d8d0; stroke-width:10; }
</style>
<rect width="8000" height="6000" fill="#f5f5f0"/>
<circle cx="7200" cy="740" r="520" fill="#fce4e6" opacity="0.8"/>
<circle cx="680" cy="5350" r="720" fill="#f0f4f8" opacity="0.95"/>
<text x="560" y="620" font-size="122" fill="#e63946" font-weight="900" letter-spacing="22">ADAPTIVE HTML IMAGE SYSTEM</text>
<text x="560" y="980" font-size="300" fill="#1a1a1a" font-weight="900" text-anchor="start">
<tspan x="560" dy="0">섹션 이미지 선택 의사결정 트리</tspan>
</text>
<text x="570" y="1280" font-size="118" fill="#4a4a4a" font-weight="560" text-anchor="start">
<tspan x="570" dy="0">이미지를 찾을지 만들지 판단하는 운영 규칙</tspan>
</text>
<rect x="580" y="1580" width="2500" height="900" rx="120" fill="#ffffff" stroke="#d8d8d0" stroke-width="14"/>
<rect x="580" y="1580" width="26" height="900" rx="13" fill="#e63946"/>
<text x="700" y="1750" font-size="88" fill="#e63946" font-weight="900" letter-spacing="10">Q1</text>
<text x="700" y="1930" font-size="150" fill="#1a1a1a" font-weight="900" text-anchor="start">
<tspan x="700" dy="0">현실 이미지가 필요한가?</tspan>
</text>
<text x="700" y="2180" font-size="104" fill="#4a4a4a" font-weight="520" text-anchor="start">
<tspan x="700" dy="0">제품 사진, 실제 인물, 장소,</tspan>
<tspan x="700" dy="138.32">뉴스 현장처럼 현실성이 핵심이면</tspan>
<tspan x="700" dy="138.32">라이선스 이미지 검색</tspan>
</text>
<rect x="4920" y="1580" width="2500" height="900" rx="120" fill="#ffffff" stroke="#d8d8d0" stroke-width="14"/>
<rect x="4920" y="1580" width="26" height="900" rx="13" fill="#3a6280"/>
<text x="5040" y="1750" font-size="88" fill="#3a6280" font-weight="900" letter-spacing="10">Q2</text>
<text x="5040" y="1930" font-size="150" fill="#1a1a1a" font-weight="900" text-anchor="start">
<tspan x="5040" dy="0">개념 설명이 핵심인가?</tspan>
</text>
<text x="5040" y="2180" font-size="104" fill="#4a4a4a" font-weight="520" text-anchor="start">
<tspan x="5040" dy="0">프로세스, 비교, 정책, 구조라면</tspan>
<tspan x="5040" dy="138.32">직접 만든 인포그래픽이 더 명확</tspan>
</text>
<path d="M3080 2030 C3700 2030 4300 2030 4920 2030" fill="none" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>
<polygon points="4900,2030 4720,1930 4720,2130" fill="#1a1a1a"/>
<rect x="580" y="3040" width="2020" height="1040" rx="120" fill="#ffffff" stroke="#d8d8d0" stroke-width="14"/>
<rect x="580" y="3040" width="26" height="1040" rx="13" fill="#e63946"/>
<text x="700" y="3250" font-size="150" fill="#1a1a1a" font-weight="900" text-anchor="start">
<tspan x="700" dy="0">SOURCE</tspan>
</text>
<text x="700" y="3500" font-size="104" fill="#4a4a4a" font-weight="520" text-anchor="start">
<tspan x="700" dy="0">Unsplash/Pexels/Openverse/</tspan>
<tspan x="700" dy="138.32">Wikimedia 등에서 검색</tspan>
<tspan x="700" dy="138.32">출처와 라이선스 기록</tspan>
</text>
<rect x="2990" y="3040" width="2020" height="1040" rx="120" fill="#ffffff" stroke="#d8d8d0" stroke-width="14"/>
<rect x="2990" y="3040" width="26" height="1040" rx="13" fill="#2a7d5a"/>
<text x="3110" y="3250" font-size="150" fill="#1a1a1a" font-weight="900" text-anchor="start">
<tspan x="3110" dy="0">SVG INFOGRAPHIC</tspan>
</text>
<text x="3110" y="3500" font-size="104" fill="#4a4a4a" font-weight="520" text-anchor="start">
<tspan x="3110" dy="0">8000×6000 캔버스</tspan>
<tspan x="3110" dy="138.32">텍스트 적음, 구조 선명</tspan>
<tspan x="3110" dy="138.32">모바일에서도 축소 가독성</tspan>
</text>
<rect x="5400" y="3040" width="2020" height="1040" rx="120" fill="#ffffff" stroke="#d8d8d0" stroke-width="14"/>
<rect x="5400" y="3040" width="26" height="1040" rx="13" fill="#d99a38"/>
<text x="5520" y="3250" font-size="150" fill="#1a1a1a" font-weight="900" text-anchor="start">
<tspan x="5520" dy="0">AI GENERATED</tspan>
</text>
<text x="5520" y="3500" font-size="104" fill="#4a4a4a" font-weight="520" text-anchor="start">
<tspan x="5520" dy="0">현실성보다 메타포가 필요할 때</tspan>
<tspan x="5520" dy="138.32">브랜드/인물/사실 혼동 금지</tspan>
<tspan x="5520" dy="138.32">검수 후 사용</tspan>
</text>
<path d="M1580 2480 L1580 3040" fill="none" stroke="#d8d8d0" stroke-width="16" stroke-linecap="round"/>
<path d="M4000 2480 L4000 3040" fill="none" stroke="#d8d8d0" stroke-width="16" stroke-linecap="round"/>
<path d="M6410 2480 L6410 3040" fill="none" stroke="#d8d8d0" stroke-width="16" stroke-linecap="round"/>
<rect x="1220" y="4460" width="5560" height="720" rx="120" fill="#ffffff" stroke="#d8d8d0" stroke-width="14"/>
<rect x="1220" y="4460" width="26" height="720" rx="13" fill="#1a1a1a"/>
<text x="1340" y="4670" font-size="150" fill="#1a1a1a" font-weight="900" text-anchor="start">
<tspan x="1340" dy="0">자동 판단 규칙</tspan>
</text>
<text x="1340" y="4920" font-size="104" fill="#4a4a4a" font-weight="520" text-anchor="start">
<tspan x="1340" dy="0">사진은 신뢰를 만들고, 인포그래픽은 이해를 만듭니다. 전문가/교육/레퍼런스/비교 모드는 기본적으로 인포그래픽 우선입니다.</tspan>
</text>
<text x="7440" y="5600" font-size="84" text-anchor="end" fill="#7a7a7a" font-weight="700">8000×6000 SVG · scalable infographic</text>
</svg>