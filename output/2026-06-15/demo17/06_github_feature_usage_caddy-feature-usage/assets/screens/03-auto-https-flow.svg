<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t3 d3" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="t3">개념 와이어프레임 — 실제 제품 스크린샷 아님</title>
  <desc id="d3">브라우저 요청이 Caddy를 거쳐 백엔드로 가는 동안 Caddy가 ACME로 TLS 인증서를 자동 발급·갱신하는 흐름을 나타낸 개념 다이어그램이다. 실제 제품 화면이 아니라 구조 설명용 와이어프레임이다.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#f4f4ef"/>
  <text x="320" y="38" fill="#26262c" font-size="15" font-weight="700" text-anchor="middle">자동 HTTPS 동작 흐름 (개념도)</text>
  <text x="320" y="58" fill="#8a8a80" font-size="11" text-anchor="middle">개념 와이어프레임 — 실제 제품 스크린샷 아님</text>

  <!-- browser -->
  <rect x="36" y="150" width="120" height="80" rx="10" fill="#ffffff" stroke="#d2d2c6"/>
  <rect x="48" y="162" width="96" height="14" rx="3" fill="#eef0f4"/>
  <circle cx="55" cy="169" r="2.5" fill="#e06c5a"/><circle cx="63" cy="169" r="2.5" fill="#e3b341"/><circle cx="71" cy="169" r="2.5" fill="#7ea66a"/>
  <text x="96" y="200" fill="#55554d" font-size="12" text-anchor="middle">브라우저</text>
  <text x="96" y="216" fill="#8a8a80" font-size="10" text-anchor="middle">https://example.com</text>

  <!-- caddy -->
  <rect x="252" y="135" width="136" height="110" rx="12" fill="#23321f" stroke="#3a5230"/>
  <text x="320" y="166" fill="#9bd17e" font-size="14" font-weight="700" text-anchor="middle">Caddy</text>
  <text x="320" y="188" fill="#cfe3c2" font-size="10.5" text-anchor="middle">TLS 종료 · HTTP/2·3</text>
  <text x="320" y="206" fill="#cfe3c2" font-size="10.5" text-anchor="middle">리버스 프록시</text>
  <text x="320" y="224" fill="#cfe3c2" font-size="10.5" text-anchor="middle">HTTP→HTTPS 리다이렉트</text>

  <!-- backend -->
  <rect x="484" y="150" width="120" height="80" rx="10" fill="#ffffff" stroke="#d2d2c6"/>
  <text x="544" y="186" fill="#55554d" font-size="12" text-anchor="middle">백엔드 앱</text>
  <text x="544" y="204" fill="#8a8a80" font-size="10" text-anchor="middle">localhost:8080</text>

  <!-- ACME CA -->
  <rect x="252" y="300" width="136" height="64" rx="10" fill="#eef3fb" stroke="#c3d3ee"/>
  <text x="320" y="328" fill="#3a5fb0" font-size="12" font-weight="700" text-anchor="middle">ACME CA</text>
  <text x="320" y="346" fill="#5a76b8" font-size="10" text-anchor="middle">Let's Encrypt / ZeroSSL</text>

  <!-- arrows -->
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#55554d"/></marker>
  <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#3a5fb0"/></marker></defs>
  <line x1="156" y1="190" x2="248" y2="190" stroke="#55554d" stroke-width="2" marker-end="url(#ah)"/>
  <text x="202" y="182" fill="#55554d" font-size="10" text-anchor="middle">HTTPS 요청</text>
  <line x1="388" y1="190" x2="480" y2="190" stroke="#55554d" stroke-width="2" marker-end="url(#ah)"/>
  <text x="434" y="182" fill="#55554d" font-size="10" text-anchor="middle">평문 프록시</text>
  <line x1="320" y1="245" x2="320" y2="296" stroke="#3a5fb0" stroke-width="2" marker-end="url(#ab)" stroke-dasharray="5 4"/>
  <text x="332" y="276" fill="#3a5fb0" font-size="10" text-anchor="start">인증서 발급·자동 갱신</text>
</svg>
