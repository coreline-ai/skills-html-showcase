<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t2 d2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="t2">개념 와이어프레임 — 실제 제품 스크린샷 아님</title>
  <desc id="d2">에디터에서 Caddyfile을 편집하는 모습을 나타낸 개념 목업이다. 사이트 주소, 리버스 프록시, 정적 파일 루트, 압축 지시어를 보여준다. 실제 Caddy/에디터 스크린샷이 아니라 구조 설명용 와이어프레임이다.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#f4f4ef"/>
  <rect x="24" y="24" width="592" height="352" rx="12" fill="#fbfbf8" stroke="#d9d9cf"/>
  <rect x="24" y="24" width="592" height="34" rx="12" fill="#efefe8"/>
  <rect x="24" y="46" width="592" height="12" fill="#efefe8"/>
  <rect x="44" y="34" width="120" height="16" rx="4" fill="#ffffff" stroke="#d2d2c6"/>
  <text x="52" y="46" fill="#55554d" font-size="11">Caddyfile</text>
  <text x="600" y="46" fill="#9a9a90" font-size="11" text-anchor="end">개념 목업</text>
  <g font-size="13">
    <text x="46" y="92" fill="#a0a096">1</text><text x="78" y="92" fill="#2f6f43" font-weight="700">example.com {</text>
    <text x="46" y="116" fill="#a0a096">2</text><text x="98" y="116" fill="#3a5fb0" font-weight="700">reverse_proxy</text><text x="210" y="116" fill="#55554d">localhost:8080</text>
    <text x="46" y="140" fill="#a0a096">3</text><text x="78" y="140" fill="#2f6f43">}</text>
    <text x="46" y="172" fill="#a0a096">4</text>
    <text x="46" y="196" fill="#a0a096">5</text><text x="78" y="196" fill="#2f6f43" font-weight="700">static.example.com {</text>
    <text x="46" y="220" fill="#a0a096">6</text><text x="98" y="220" fill="#3a5fb0" font-weight="700">root</text><text x="142" y="220" fill="#55554d">* /srv/site</text>
    <text x="46" y="244" fill="#a0a096">7</text><text x="98" y="244" fill="#3a5fb0" font-weight="700">encode</text><text x="168" y="244" fill="#55554d">zstd gzip</text>
    <text x="46" y="268" fill="#a0a096">8</text><text x="98" y="268" fill="#3a5fb0" font-weight="700">file_server</text>
    <text x="46" y="292" fill="#a0a096">9</text><text x="78" y="292" fill="#2f6f43">}</text>
  </g>
  <rect x="44" y="312" width="552" height="34" rx="8" fill="#eef3fb" stroke="#c3d3ee"/>
  <text x="60" y="334" fill="#3a5fb0" font-size="12">사이트 블록 1개 = 한 도메인. reverse_proxy / root+file_server 한 줄로 역할 결정</text>
  <text x="44" y="366" fill="#9a9a90" font-size="11">개념 와이어프레임 — 실제 제품 스크린샷 아님</text>
</svg>
