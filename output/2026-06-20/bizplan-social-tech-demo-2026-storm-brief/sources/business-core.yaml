  severity: "[사실] 사망·중상 등 비가역 피해 + 인력관제 비용 증가(요양보호사 배치 2.3→2.1:1 강화, src#13)"
  current_alternatives: "[사실] 인력 중심 CCTV 반복 관제, 콜벨·매트센서·웨어러블, 일부 레이더 낙상감지 (src#33,34)"
