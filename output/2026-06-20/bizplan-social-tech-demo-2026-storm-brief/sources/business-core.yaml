solution:
  product: "[목표] 폐쇄형 보호시설 공통 영상AI 위험상황 신속대응 플랫폼 (탐지 엔진 + 다채널 관제 + 신속 경보·연계)"
  core_mechanism: "[목표] CCTV 영상 입력 → 엣지 skeleton 추출·약지도 이상탐지로 위험 8종 분류 → 위험수준별 3초 내 경보 → 관제·현장요원·관할기관(소방·경찰) 연계"
  key_features:
    - "[목표] 위험상황 8종 탐지(쓰러짐·실신·낙상·자해·자살징후·폭행·금지구역 접근·통제구역 이탈)"
    - "[목표] 다채널 실시간 분석 + 위험수준별 신속 경보(3초 이내)"
    - "[목표] 저조도·가림·밀집 환경 오탐·미탐 개선 모듈"
    - "[목표] privacy-by-design(엣지 처리·골격 비식별·적용제외 zone) — 규제 대응 (src#09,10,50)"
  use_cases: "[사실] 야간 무인 관제 자해·낙상 즉시 경보; 통제구역 이탈 알림; 폭행 발생 신속 대응"
  measurable_outcome: "[목표] 인력관제 대비 위험 탐지·대응시간 단축(발생→경보 3초), 오탐 감소 (RFP 성과지표 기준)"

technology:
