  architecture: "[목표] 엣지 디바이스(비식별 골격 추출) → 온프레미스 탐지 서버 → 통합관제·경보 (07-diagrams 추진체계·아키텍처)"
  current_stage: "[가상] PoC/시제품 — 낙상·쓰러짐·폭행 일부 이벤트 동작 (CF#5)"
  target_performance: "[목표] 통합탐지 F1 80→85%@실증DB, 위험 8종, 대응 3초, 통합분석 10fps, CCTV 50대, 실증 2곳, 만족도 80점 (RFP 성과지표 고정)"
  verification_method: "[목표] 1·2차 자체시험, 3차 공인기관 시험인증; 실증DB(위험상황별 500개·30초+ 동영상) 기반 검증 (RFP 성과지표 비고)"

