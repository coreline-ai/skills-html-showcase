<svg data-theme="final_20260604-soft-editorial-v2" xmlns="http://www.w3.org/2000/svg" width="8000" height="6000" viewBox="0 0 8000 6000" role="img" aria-labelledby="title desc">
<title id="title">연결 노드</title>
<desc id="desc">관계와 연결망을 부드러운 노드 구조로 표현하는 도형.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffdfb"/><stop offset=".58" stop-color="#fbfaf6"/><stop offset="1" stop-color="#eee9df"/>
  </linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1ccd0"/><stop offset="1" stop-color="#d77a82"/></linearGradient>
  <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce9df"/><stop offset="1" stop-color="#6f967f"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3e4c2"/><stop offset="1" stop-color="#d7a655"/></linearGradient>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="34" stdDeviation="58" flood-color="#a0917e" flood-opacity=".10"/></filter>
