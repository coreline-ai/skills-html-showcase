<svg data-theme="final_20260604-soft-editorial-v2" xmlns="http://www.w3.org/2000/svg" width="8000" height="6000" viewBox="0 0 8000 6000" role="img" aria-labelledby="title desc">
<title id="title">코드 윈도우</title>
<desc id="desc">개발·자동화 흐름을 밝은 코드 카드로 표현하는 도형.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffdfb"/><stop offset=".58" stop-color="#fbfaf6"/><stop offset="1" stop-color="#eee9df"/>
  </linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1ccd0"/><stop offset="1" stop-color="#d77a82"/></linearGradient>
  <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce9df"/><stop offset="1" stop-color="#6f967f"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3e4c2"/><stop offset="1" stop-color="#d7a655"/></linearGradient>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="34" stdDeviation="58" flood-color="#a0917e" flood-opacity=".10"/></filter>
  <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#a0917e" flood-opacity=".11"/></filter>
  <style><![CDATA[
    .stroke{fill:none;stroke:#6a6258;stroke-width:84;stroke-linecap:round;stroke-linejoin:round;opacity:.48}
    .thin{fill:none;stroke:#6a6258;stroke-width:52;stroke-linecap:round;stroke-linejoin:round;opacity:.32}
    .rose{fill:#d77a82}.rose-soft{fill:#f1ccd0}.sage{fill:#6f967f}.sage-soft{fill:#dce9df}.gold{fill:#d7a655}.gold-soft{fill:#f3e4c2}
    .paper{fill:#fffdfb}.line{stroke:#d8d8d0}.motif{filter:url(#softShadow)}
  ]]></style>
</defs>
<rect width="8000" height="6000" fill="#f5f5f0"/>
<rect x="520" y="520" width="6960" height="4960" rx="360" fill="url(#paper)" stroke="#d8d8d0" stroke-width="18" filter="url(#cardShadow)"/>
<ellipse cx="4000" cy="3050" rx="1960" ry="1470" fill="#eee9df" opacity=".28"/>
<g class="motif" transform="translate(4000 3000)">

<rect x="-1540" y="-1120" width="3080" height="2240" rx="230" fill="#fffdfb" stroke="#d8d8d0" stroke-width="58"/>
<rect x="-1540" y="-1120" width="3080" height="430" rx="230" fill="#eee9df"/>
<circle cx="-1190" cy="-900" r="78" fill="#d77a82"/><circle cx="-940" cy="-900" r="78" fill="#d7a655"/><circle cx="-690" cy="-900" r="78" fill="#6f967f"/>
<rect x="-1010" y="-300" width="1180" height="96" rx="48" fill="#d77a82" opacity=".82"/>
<rect x="-1010" y="80" width="1880" height="96" rx="48" fill="#dce9df"/>
<rect x="-1010" y="460" width="1500" height="96" rx="48" fill="#eee9df"/>

</g>
