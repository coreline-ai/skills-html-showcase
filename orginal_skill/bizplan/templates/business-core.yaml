# =============================================================================
# business-core.yaml  —  모든 문서가 파생하는 단일 사업 코어 (PRD §14)
#
# 작성 규칙:
#  1. 모든 값에 증거 태그를 붙인다: [사실] [추정] [가정] [목표] [확인 필요]
#     예) frequency: "[사실] 주 3회 (인터뷰 transcript L120, 사용자 직접 경험)"
#         tam: "[추정] 1.2조원 (market-sizing.xlsx, 통계청 2025 사업체수 × ARPU 가정)"
#  2. 모든 수치 근거는 source-index.xlsx 또는 evidence-ledger.xlsx 행을 참조한다.
#  3. AI가 임의로 만든 값 금지. 모르면 "[확인 필요] (인터뷰 후속 항목 N)" 로 둔다.
#  4. 이 파일이 바뀌면 파생 문서(draft/엑셀/덱)를 모두 갱신한다. 숫자 불일치 0.
# =============================================================================

project:
  name:            # 프로젝트명
  slug:            # 영문 slug (폴더명)
  notice:          # 공고명 / 공고 URL (없으면 "해당 없음")
  document_type:   # 정부지원 / R&D / 산학협력 / 투자덱 / 기업제안 / 공공제안 / 내부신사업 / 자유형식
  deadline:        # YYYY-MM-DD

business:
  one_line_definition:   # "누구의 어떤 문제를 어떤 방식으로 해결한다" 한 문장
  title:                 # 확정 과제명 (title-candidates.md 권장안)
  purpose:               # 사업 목적
  vision:                # 3년 후 모습

customer:
  primary_customer:      # 핵심 고객 (구체적 세그먼트)
  user:                  # 실제 사용자
  buyer:                 # 구매 결정자 (사용자와 다를 수 있음)
  beneficiary:           # 수혜자
  early_adopter:         # 가장 먼저 구매할 고객 + 만날 수 있는 경로

problem:
  core_problem:          # 핵심 문제
  evidence:              # 문제 존재 근거 (인터뷰/통계 출처)
  frequency:             # 발생 빈도
  severity:              # 심각도 (미해결 시 누가 어떤 손실)
  current_alternatives:  # 고객이 현재 쓰는 대안 (엑셀/외주/수작업/기존제품)
  alternative_limitations: # 기존 방식의 한계 / 못 버리는 이유

solution:
  product:               # 제품/서비스
  core_mechanism:        # 작동 방식 (입력→처리→출력)
  key_features:          # 반드시 필요한 핵심 기능 (없어도 되는 건 제외)
  use_cases:             # 핵심 사용 시나리오
  measurable_outcome:    # 정량 효과 (예: 처리시간 8h→1h, [목표]인지 [사실]인지 명시)

technology:
  core_technology:       # 핵심 기술
  technical_challenge:   # 가장 어려운 기술 난제
  architecture:          # 시스템 구성 (07-diagrams 참조)
  current_stage:         # 현재 구현 단계 (아이디어/설계/프로토타입/PoC/상용)
  target_performance:    # 정량 목표 성능 + 검증 조건
  verification_method:   # 성공 검증 지표·방법

market:
  tam:                   # 전체 시장 (산식 필수)
  sam:                   # 유효 시장
  som:                   # 수익 시장 (3년 목표)
  calculation:           # TAM/SAM/SOM 산출 근거 (market-sizing.xlsx 행)
  target_segment:        # 초기 타겟 세그먼트

competition:
  direct:                # 직접 경쟁 제품/회사 (강점도 기록)
  indirect:              # 간접 경쟁
  substitutes:           # 대체재 ("아무것도 안 함" 포함)
  positioning:           # 포지셔닝 (경쟁 포지셔닝 맵 참조)
  differentiation:       # 차별성 (기술 차별 vs 사업 차별 구분)

intellectual_property:
  owned_patents:         # 보유 특허/출원
  relevant_patents:      # 관련 주요 특허 (patent-list.xlsx)
  risk_patents:          # 위험 특허 (claim-chart.xlsx, 변리사 검토 대상 표시)
  filing_opportunities:  # 권리화 기회 (patent-opportunity.md)

research:
  key_papers:            # 핵심 논문 (paper-evidence-table.xlsx)
  technology_readiness:  # TRL (technology-readiness.md)
  research_gap:          # 연구 공백 = 우리 기회 (research-gap-analysis.md)

business_model:
  revenue_model:         # 수익 모델 (일회성/구독/구축형)
  pricing:               # 가격 (근거)
  sales_channel:         # 판매 채널
  customer_acquisition:  # 고객 확보 과정 (첫 10명 경로)
  unit_economics:        # 단위 경제성 (CAC/LTV/마진, financial-model.xlsx)

traction:
  revenue:               # 매출 실적 ([사실]만)
  users:                 # 사용자/상담 실적
  contracts:             # 계약
  pilots:                # PoC/파일럿
  interviews:            # 고객 인터뷰 기록
  partnerships:          # MOU/LOI/제휴

team:
  internal_members:      # 내부 인력 + 역할 + founder-market fit
  external_partners:     # 외부 파트너/기관
  missing_roles:         # 부족한 역량 (정직하게)
  founder_market_fit:    # 대표가 이 사업에 적합한 이유

execution:
  milestones:            # 주요 마일스톤
  roadmap:               # 개발/사업화 로드맵 (일정)
  risks:                 # 사업 위험
  mitigation:            # 대응 방안

finance:
  required_budget:       # 필요 자금 (지원금/투자금)
  use_of_funds:          # 자금 사용처
  revenue_forecast:      # 매출 추정 (가정 명시, financial-model.xlsx)
  assumptions:           # 추정의 전제 가정

impact:
  employment:            # 고용 효과
  economic:              # 경제적 파급
  social:                # 사회적 효과
  policy_alignment:      # 정책 부합성 (공고 목적과 연결)
